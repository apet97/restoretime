name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN cannot list a pull request's commits, which gitleaks needs to scan the
# diff — without these it fails with "Resource not accessible by integration" (403). Least
# privilege: read-only, and only the two scopes the scan needs.
permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to diff against (docs/15 gate 6, "secret scan of the diff") —
          # a shallow checkout has nothing to diff.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of the Node version: better-sqlite3 ^11 ships no prebuild
          # for Node 26 and its node-gyp fallback fails there, so local and CI must agree.
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # `test:e2e` builds exactly once before the suite. Its shipped-bundle test then boots the
      # resulting dist/static/app.js instead of an ignored artifact left by an older local build.
      - run: npm run test:e2e

      # Gate 6 (docs/15): secret scan of the diff. A GitHub Action, not an npm dependency — the
      # closed dependency list (implementation/DEPENDENCIES.md) is untouched. `gitleaks/
      # gitleaks-action` is free for a personal-account repo (github.com/apet97/restoretime,
      # docs/15 "Repository") — no `GITLEAKS_LICENSE` needed. It is required only for
      # organization-owned repos; if this repository is ever transferred to an organization, add
      # `GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}` to this step's `env`.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
