name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of the Node version: better-sqlite3 ^11 ships no prebuild
          # for Node 26 and its node-gyp fallback fails there, so local and CI must agree.
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # After build: the E2E suite's last test boots the real dist/static/app.js, so the artifact
      # has to exist. Everything before it runs against source.
      - run: npm run test:e2e
